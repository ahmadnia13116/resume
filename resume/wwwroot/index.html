<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ahmadnia</title>

    <base href="/" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="css/Layout.css" rel="stylesheet" />

    <style>

        body {
            margin: 0;
            padding: 0;
            background: #f5f5f5;
        }

        /* LOADING OVERLAY */
        #loading-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #e8f5e9, #f5f5dc, #faf8f0);
            z-index: 99999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

            #loading-overlay.hidden {
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
            }

        /* Spinner */
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(0, 105, 92, 0.15);
            border-top-color: #00695c;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .brand {
            font-family: 'Inter', sans-serif;
            font-size: 18px;
            font-weight: 600;
            color: #00695c;
            letter-spacing: 4px;
        }

        /* APP ROOT */
        #app {
            min-height: 100vh;
        }
    </style>
</head>

<body>

    <!-- LOADING -->
    <div id="loading-overlay">
        <div class="spinner"></div>
        <div class="brand">AHMADNIA</div>
    </div>

    <!-- BLazor root -->
    <div id="app"></div>

    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>

    <script>
        // ✅ صحیح‌ترین روش برای Blazor WASM
        (function () {
            function hideLoader() {
                const loader = document.getElementById('loading-overlay');
                if (!loader) return;

                loader.classList.add('hidden');

                setTimeout(() => {
                    loader.remove();
                }, 500);
            }

            window.addEventListener('load', function () {
                // صبر برای Blazor render
                setTimeout(hideLoader, 300);
            });
        })();
    </script>

    <script>
        // Scroll interop (safe version)
        let scrollHandler = null;
        let dotNetRef = null;

        window.addScrollListener = function (ref) {

            dotNetRef = ref;

            if (scrollHandler) {
                window.removeEventListener('scroll', scrollHandler);
            }

            scrollHandler = function () {
                const scrollY = window.scrollY || document.documentElement.scrollTop || 0;

                if (dotNetRef) {
                    dotNetRef.invokeMethodAsync('UpdateNavOnScroll', Math.floor(scrollY));
                }
            };

            window.addEventListener('scroll', scrollHandler, { passive: true });

            scrollHandler();
        };

        window.removeScrollListener = function () {
            if (scrollHandler) {
                window.removeEventListener('scroll', scrollHandler);
            }

            scrollHandler = null;
            dotNetRef = null;
        };
    </script>

</body>

</html>
